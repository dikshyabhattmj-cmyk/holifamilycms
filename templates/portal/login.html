<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Holi Family Secondary School</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background: radial-gradient(circle at 50% 30%, #1e3a8a 0%, #0f2b59 50%, #07162c 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4 text-white">
          <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center shadow mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h3 class="fw-bold mb-1">Administrative CMS</h3>
          <p class="text-white-50 small">Holi Family Secondary School Portal</p>
        </div>

        <div class="bg-white p-4 p-md-5 rounded-4 shadow-lg">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags|default:'danger' }} small py-2">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold small text-muted">Admin Username</label>
              {{ form.username }}
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold small text-muted">Password</label>
              {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" style="background-color: #0f2b59; border-color: #0f2b59;">
              <i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'home' %}" class="small text-muted text-decoration-none">
              <i class="fa-solid fa-arrow-left me-1"></i> Return to School Website
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
